<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComChat - Sala de Chat</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>ComChat - Sala de Chat</h1>
        <div class="messages" id="messagesZone"></div>
        <div class="users" id="usersZone">
            <h3>Usuarios Activos</h3>
        </div>
        <div>
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." />
            <button id="sendMessageButton">Enviar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/pantallaChat.js"></script>
</body>
</html>
